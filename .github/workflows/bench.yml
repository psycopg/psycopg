name: Benchmark

# Run tests/scripts/bench_compare.py on different platforms. See the script
# for details. Results are reported in the jobs summaries.
#
# This workflow is not active: copy it to .github/workflows/ to run it.
#
# On push, compare origin/master with the commit pushed. On pull request,
# compare the base of the pull request with the merge commit, only on Linux.
# In both cases, check for regressions, reporting them as warnings. Other
# comparisons can be run manually setting ARGS, for example:
#
#   # Compare two branches
#   --tree base=origin/master --tree pr=origin/my-branch
#
#   # Compare the wait functions (with IMPL=c; on Windows use wait_select)
#   --tree poll=. --env poll=PSYCOPG_WAIT_FUNC=wait_poll
#   --tree c=. --env c=PSYCOPG_WAIT_FUNC=wait_c
#
#   # Compare copy options, only the copy measures
#   --copy-only --tree libpq=.
#   --tree queued=. --copy-arg queued=--writer=QueuedLibpqWriter
#
# The refs must be available in the clone, e.g. branches of the repository the
# workflow runs in. ARGS is split on blanks: quotes are not supported.

on:
  push:
    # This should disable running the workflow on tags, according to the
    # on.<push|pull_request>.<branches|tags> GitHub Actions docs.
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/bench.yml
      - psycopg/**
      - psycopg_c/**
      - tests/scripts/bench_compare.py
      - tests/scripts/benchmark.py
  pull_request:
    paths:
      - .github/workflows/bench.yml
      - psycopg/**
      - psycopg_c/**
      - tests/scripts/bench_compare.py
      - tests/scripts/benchmark.py
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments for bench_compare.py"
        default: "--tree base=origin/master --tree head=."
      impl:
        description: "psycopg implementation"
        type: choice
        options: [python, c]
        default: python
      rounds:
        description: "Number of rounds of measures"
        default: "5"
      check:
        description: "Check for regressions: warn, fail, off"
        type: choice
        options: [warn, fail, "off"]
        default: warn
      platforms:
        description: "Platforms to run on, among linux, macos, windows"
        default: "linux macos windows"

concurrency:
  # Cancel older requests of the same workflow in the same branch.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # On pull request: compare the pull request base with the merge commit.
  ARGS: ${{ inputs.args || (github.event_name == 'pull_request' && format('--tree base={0} --tree head=.', github.event.pull_request.base.sha)) || '--tree base=origin/master --tree head=.' }}
  PSYCOPG_IMPL: ${{ inputs.impl || 'python' }}
  ROUNDS: ${{ inputs.rounds || '5' }}
  CHECK: ${{ inputs.check || 'warn' }}

jobs:

  linux:  # {{{
    if: ${{ !inputs.platforms || contains(inputs.platforms, 'linux') }}
    runs-on: ubuntu-latest

    env:
      PSYCOPG_TEST_DSN: "host=127.0.0.1 user=postgres password=password"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Start PostgreSQL service
        run: |
          docker pull postgres:18
          docker run --rm -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=password postgres:18

      - name: Install Python packages
        run: pip install ./psycopg

      - name: Install the C implementation
        if: ${{ env.PSYCOPG_IMPL == 'c' }}
        run: pip install ./psycopg_c

      - name: Run benchmark
        run: |
          python tests/scripts/bench_compare.py \
            --impl $PSYCOPG_IMPL --rounds $ROUNDS \
            $( [ "$CHECK" = off ] || echo "--check $CHECK" ) $ARGS


  # }}}

  macos:  # {{{
    # Not on pull request: Linux runners are the least noisy.
    if: ${{ github.event_name != 'pull_request' && (!inputs.platforms || contains(inputs.platforms, 'macos')) }}
    runs-on: macos-latest

    env:
      PSYCOPG_TEST_DSN: "host=127.0.0.1 user=runner dbname=postgres"
      PG_VERSION: "18"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PostgreSQL on the runner
        run: brew install postgresql@${PG_VERSION}

      - name: Start PostgreSQL service
        run: brew services start postgresql@${PG_VERSION}

      - name: Find the libpq and pg_config
        run: |
          echo "DYLD_LIBRARY_PATH=/opt/homebrew/opt/postgresql@${PG_VERSION}/lib/postgresql:/opt/homebrew/opt/postgresql@${PG_VERSION}/lib:$DYLD_LIBRARY_PATH" \
              >> $GITHUB_ENV
          echo "PATH=/opt/homebrew/opt/postgresql@${PG_VERSION}/bin:$PATH" >> $GITHUB_ENV

      - name: Install Python packages
        run: pip install ./psycopg

      - name: Install the C implementation
        if: ${{ env.PSYCOPG_IMPL == 'c' }}
        run: pip install ./psycopg_c

      - name: Run benchmark
        run: |
          python tests/scripts/bench_compare.py \
            --impl $PSYCOPG_IMPL --rounds $ROUNDS \
            $( [ "$CHECK" = off ] || echo "--check $CHECK" ) $ARGS


  # }}}

  windows:  # {{{
    # Not on pull request: Linux runners are the least noisy.
    if: ${{ github.event_name != 'pull_request' && (!inputs.platforms || contains(inputs.platforms, 'windows')) }}
    runs-on: windows-2025

    env:
      PSYCOPG_TEST_DSN: "host=127.0.0.1 dbname=postgres"

    defaults:
      run:
        shell: bash

    steps:
      # there are some extra libpq.dll in PATH
      - run: rm -rf c:/tools/php C:/Strawberry/c/bin

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Start PostgreSQL service
        run: |
          $PgSvc = Get-Service "postgresql*"
          Set-Service $PgSvc.Name -StartupType manual
          $PgSvc.Start()
        shell: powershell

      - name: Export GitHub Actions cache environment variables
      # https://learn.microsoft.com/en-us/vcpkg/consume/binary-caching-github-actions-cache
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('path')
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.addPath(path.join(process.env.VCPKG_INSTALLATION_ROOT, 'installed/x64-windows-release/lib'));
            core.addPath(path.join(process.env.VCPKG_INSTALLATION_ROOT, 'installed/x64-windows-release/bin'));

      - name: Install libpq from vcpkg and install pg_config.exe stub
        run: .\tools\ci\wheel_win32_before_build.bat
        shell: powershell
        env:
          # cache vcpkg
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      - name: Install Python packages
        # psutil is used to measure memory usage, as resource is not available.
        run: pip install ./psycopg psutil

      - name: Install the C implementation
        if: ${{ env.PSYCOPG_IMPL == 'c' }}
        run: |
          # If the wheel is not delocated, import fails with some dll not found
          # (but it won't tell which one).
          pip wheel -v -w ./psycopg_c/dist/ ./psycopg_c/
          delvewheel repair --no-mangle "libiconv-2.dll;libwinpthread-1.dll" \
            -w ./wheelhouse/ psycopg_c/dist/psycopg*.whl
          pip install ./wheelhouse/*.whl

      - name: Run benchmark
        run: |
          python tests/scripts/bench_compare.py \
            --impl $PSYCOPG_IMPL --rounds $ROUNDS \
            $( [ "$CHECK" = off ] || echo "--check $CHECK" ) $ARGS


  # }}}
